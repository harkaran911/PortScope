{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}PortScope{% endblock %} — Advanced Port Scanner</title>
  <link rel="stylesheet" href="{% static 'scanner/css/style.css' %}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
</head>
<body>

<!-- ── Sidebar ──────────────────────────────────────────────────────────────── -->
<aside class="sidebar">
  <div class="sidebar-brand">
    <div class="brand-icon">
      <svg viewBox="0 0 40 40" fill="none">
        <circle cx="20" cy="20" r="18" stroke="var(--accent)" stroke-width="2"/>
        <circle cx="20" cy="20" r="12" stroke="var(--accent)" stroke-width="1.5" opacity=".6"/>
        <circle cx="20" cy="20" r="6"  stroke="var(--accent)" stroke-width="1.2" opacity=".4"/>
        <circle cx="20" cy="20" r="2.5" fill="var(--accent)"/>
        <line x1="20" y1="2" x2="20" y2="8" stroke="var(--accent)" stroke-width="2"/>
        <line x1="38" y1="20" x2="32" y2="20" stroke="var(--accent)" stroke-width="2"/>
      </svg>
    </div>
    <span class="brand-name">Port<span class="accent">Scope</span></span>
  </div>

  <nav class="sidebar-nav">
    <a href="{% url 'index' %}" class="nav-item {% block nav_home %}{% endblock %}">
      <svg viewBox="0 0 20 20" fill="currentColor"><path d="M10 2L2 8v10h5v-5h6v5h5V8L10 2z"/></svg>
      Dashboard
    </a>
    <a href="{% url 'history' %}" class="nav-item {% block nav_history %}{% endblock %}">
      <svg viewBox="0 0 20 20" fill="currentColor"><path d="M10 3a7 7 0 100 14A7 7 0 0010 3zm0 2v5l3 3-1.4 1.4L8 11.4V5h2z"/></svg>
      Scan History
    </a>
  </nav>

  <div class="sidebar-footer">
    <span class="version-tag">v1.0.0</span>
  </div>
</aside>

<!-- ── Main ─────────────────────────────────────────────────────────────────── -->
<main class="main-content">
  <header class="topbar">
    <div class="topbar-left">
      {% block breadcrumb %}
      <span class="breadcrumb-item active">Dashboard</span>
      {% endblock %}
    </div>
    <div class="topbar-right">
      <span class="status-dot online"></span>
      <span class="status-text">Engine Ready</span>
    </div>
  </header>

  <div class="page-content">
    {% block content %}{% endblock %}
  </div>
</main>

<script src="{% static 'scanner/js/app.js' %}"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
